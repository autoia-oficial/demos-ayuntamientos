<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM · AutoIA</title>
<style>
/* Tomado de la landing de AutoIA (autoia-oficial/autoia · styles.css) para que
   el CRM y la web hablen el mismo idioma visual. */
:root{
  --negro:#000; --gris:#1d1d1f;
  --tinta:#fff; --tinta2:#86868b;
  --acento:#2997ff;
  --aro:rgba(255,255,255,.06);
  --aro2:rgba(255,255,255,.12);
  --apple:cubic-bezier(.25,.1,.25,1);
  --muelle:cubic-bezier(.34,1.56,.64,1);

  /* Rampa ordinal sobre el azul de la marca. Validada contra #1d1d1f:
     luminosidad monótona, saltos ≥0.06, extremo oscuro 2.30:1, tono único. */
  --p1:#b3d9ff; --p2:#6fb6ff; --p3:#2997ff; --p4:#1f7ad8; --p5:#15569f;
  --pista:rgba(255,255,255,.07);
  --bien:#30d158; --serio:#ff9f0a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--negro); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  line-height:1.47059; font-weight:400; letter-spacing:-.022em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}

/* ─── barra superior ─── */
nav{position:sticky;top:0;z-index:99;height:52px;
  background:rgba(0,0,0,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--aro)}
.nav-in{max-width:1120px;margin:0 auto;padding:0 22px;height:100%;
  display:flex;align-items:center;justify-content:space-between}
.marca{font-size:15px;font-weight:600;letter-spacing:-.01em}
.marca span{color:var(--tinta2);font-weight:400}

.envoltorio{max-width:1120px;margin:0 auto;padding:0 22px 90px}

/* ─── hero ─── */
.hero{padding:56px 0 40px;text-align:center}
.hero h1{
  font-size:clamp(38px,7vw,68px); font-weight:700;
  letter-spacing:-.015em; line-height:1.05; margin:0 0 14px;
  background:linear-gradient(180deg,#fff 0%,#8e8e93 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
.hero p{font-size:clamp(16px,2.2vw,21px);color:var(--tinta2);margin:0}

/* ─── revelado al entrar ─── */
.rev{opacity:0;transform:translateY(24px);
  transition:opacity .8s var(--apple),transform .8s var(--apple)}
.rev.visto{opacity:1;transform:none}

/* ─── cifras ─── */
/* Columnas fijas por tramo, no auto-fit: con 6 fichas, auto-fit metía 5 en la
   primera fila y dejaba una huérfana debajo. 6 / 3 / 2 siempre reparte par. */
.cifras{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}
@media(max-width:1000px){.cifras{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.cifras{grid-template-columns:repeat(2,1fr)}}
.cifra{background:rgba(29,29,31,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--aro);border-radius:22px;padding:22px 18px;min-width:0;
  transition:transform .5s var(--apple),border-color .5s var(--apple)}
.cifra:hover{transform:translateY(-3px);border-color:var(--aro2)}
.cifra b{display:block;font-size:clamp(30px,3.4vw,40px);font-weight:600;
  letter-spacing:-.03em;line-height:1;margin-bottom:9px}
.cifra span{font-size:12px;color:var(--tinta2);letter-spacing:.01em;
  display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{width:7px;height:7px;border-radius:50%;flex:none}

/* ─── paneles ─── */
.paneles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px}
@media(max-width:880px){.paneles{grid-template-columns:1fr}}
.panel{background:rgba(29,29,31,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--aro);border-radius:24px;padding:26px 28px 22px;min-width:0}
.panel h2{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.panel .pie{font-size:13px;color:var(--tinta2);margin:0 0 22px}

/* ─── embudo ─── */
.etapa{display:grid;grid-template-columns:104px 1fr 86px;gap:12px;align-items:center;margin-bottom:11px}
.etapa .nom{font-size:13px;color:var(--tinta2);text-align:right;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.via{height:26px;background:var(--pista);border-radius:8px;overflow:hidden}
.barra{height:100%;border-radius:8px;width:0;
  transition:width .9s var(--muelle)}
.etapa .n{font-size:15px;font-weight:600;text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.etapa .cv{font-size:12px;font-weight:400;color:var(--tinta2);margin-left:4px}

/* ─── tandas ─── */
.tandas{display:flex;flex-direction:column;gap:7px;max-height:266px;overflow-y:auto;padding-right:6px}
.tandas::-webkit-scrollbar{width:5px}
.tandas::-webkit-scrollbar-thumb{background:var(--aro2);border-radius:3px}
.tanda{display:grid;grid-template-columns:52px 1fr 54px;gap:11px;align-items:center;font-size:12.5px}
.tanda .d{color:var(--tinta2);font-variant-numeric:tabular-nums}
.tanda .n{color:var(--tinta2);font-variant-numeric:tabular-nums;text-align:right}
.mini{height:8px;background:var(--pista);border-radius:4px;overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--acento);border-radius:4px;
  transition:width .9s var(--muelle)}
.leyenda{display:flex;gap:18px;font-size:12px;color:var(--tinta2);margin-top:18px}
.leyenda span{display:flex;align-items:center;gap:7px}

/* ─── controles ─── */
.filtros{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
select,input[type=search],button{
  font:inherit;font-size:14px;color:var(--tinta);
  background:rgba(29,29,31,.8);border:1px solid var(--aro);
  border-radius:12px;padding:9px 14px;letter-spacing:-.01em;
  transition:border-color .35s var(--apple),background .35s var(--apple)}
select:hover,input[type=search]:hover,button:hover{border-color:var(--aro2)}
select:focus,input:focus{outline:none;border-color:var(--acento)}
input[type=search]{flex:1;min-width:170px}
input::placeholder{color:var(--tinta2)}
button{cursor:pointer}
.cta{background:var(--acento);border-color:transparent;font-weight:500;
  transition:transform .35s var(--muelle),filter .35s var(--apple)}
.cta:hover{transform:scale(1.04);filter:brightness(1.1);border-color:transparent}

/* ─── tabla ─── */
.tabla{background:rgba(29,29,31,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--aro);border-radius:24px;overflow:hidden}
.fila{display:grid;grid-template-columns:minmax(160px,1.5fr) 62px minmax(190px,1.7fr) 142px 104px;
  gap:14px;align-items:center;padding:15px 24px;border-top:1px solid var(--aro);
  transition:background .35s var(--apple)}
.fila:not(.cab):hover{background:rgba(255,255,255,.022)}
.fila:first-child{border-top:0}
.cab{font-size:11px;color:var(--tinta2);letter-spacing:.06em;text-transform:uppercase;
  padding-top:17px;padding-bottom:13px}
.nombre{font-size:15px;font-weight:500;letter-spacing:-.01em}
.meta{font-size:12.5px;color:var(--tinta2)}
.mail{font-size:13px;color:var(--tinta2);word-break:break-all}
.sin{font-size:12.5px;color:var(--serio);display:flex;align-items:center;gap:5px}
.acc{display:flex;gap:7px;justify-content:flex-end}
.acc a,.acc button{font-size:12px;padding:5px 11px;border-radius:9px;text-decoration:none;
  border:1px solid var(--aro);color:var(--tinta2);background:transparent}
.acc a:hover,.acc button:hover{border-color:var(--acento);color:var(--tinta)}
.nota{grid-column:1/-1}
.nota input{width:100%;background:transparent;border:0;border-top:1px solid var(--aro);
  color:var(--tinta2);padding:9px 0 0;font-size:13px;border-radius:0}
.nota input:focus{outline:none;color:var(--tinta);border-color:var(--aro2)}
.vacio{padding:52px;text-align:center;color:var(--tinta2)}

@media(max-width:780px){
  .fila{grid-template-columns:1fr auto;gap:8px;padding:15px 18px}
  .cab{display:none}
  .c-d{order:2;text-align:right}.c-m{grid-column:1/-1;order:3}
  .fila>div:nth-child(4){grid-column:1/-1;order:4}
  .acc{grid-column:1/-1;justify-content:flex-start;order:5}
}
footer{margin-top:22px;font-size:12.5px;color:var(--tinta2);display:flex;gap:20px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}
  .rev{opacity:1;transform:none}}
</style>
</head>
<body>

<nav><div class="nav-in">
  <span class="marca">AutoIA <span>· CRM</span></span>
  <span class="marca" style="font-weight:400;color:var(--tinta2)" id="navsub"></span>
</div></nav>

<div class="envoltorio">

  <section class="hero">
    <h1>Ayuntamientos</h1>
    <p id="sub">Cargando…</p>
  </section>

  <div class="cifras rev" id="cifras"></div>

  <div class="paneles">
    <section class="panel rev">
      <h2>Embudo</h2>
      <p class="pie">Acumulado: cada peldaño incluye los de abajo.</p>
      <div id="embudo"></div>
    </section>
    <section class="panel rev">
      <h2>Por tanda</h2>
      <p class="pie">Cuántos se han contactado de cada envío diario.</p>
      <div class="tandas" id="tandas"></div>
      <div class="leyenda">
        <span><i class="pt" style="background:var(--acento)"></i>Contactado</span>
        <span><i class="pt" style="background:var(--pista)"></i>Pendiente</span>
      </div>
    </section>
  </div>

  <div class="filtros rev">
    <select id="fDia"><option value="">Todas las tandas</option></select>
    <select id="fEstado"><option value="">Cualquier estado</option></select>
    <select id="fContacto">
      <option value="">Cualquier contacto</option>
      <option value="email">Con correo</option>
      <option value="solo-tel">Sólo teléfono</option>
      <option value="falta">Sin contacto</option>
    </select>
    <input type="search" id="fTexto" placeholder="Buscar municipio">
    <button id="exportar" class="cta">Exportar</button>
    <button id="importar">Importar</button>
    <input type="file" id="fich" accept="application/json" hidden>
  </div>

  <div class="tabla rev" id="tabla"></div>

  <footer>
    <span id="conteo"></span>
    <span>Guardado en este navegador · expórtalo antes de formatear</span>
  </footer>
</div>

<script>
const ETAPAS=[{id:'pendiente',nom:'Pendiente'},{id:'enviado',nom:'Enviado'},
  {id:'respondido',nom:'Respondido'},{id:'reunion',nom:'Reunión'},{id:'cliente',nom:'Cliente'}];
const TODOS=[...ETAPAS.map(e=>e.id),'descartado'];
const CLAVE='crm-ayuntamientos-v1';
let municipios=[],estado={},primera=true;
const el=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cargar(){try{estado=JSON.parse(localStorage.getItem(CLAVE)||'{}')}catch{estado={}}}
function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(estado))}catch{}}
function f(s){return estado[s]??={estado:'pendiente',nota:'',fecha:''}}
const cnt=e=>municipios.filter(m=>f(m.slug).estado===e).length;
const contactado=m=>!['pendiente','descartado'].includes(f(m.slug).estado);

// Embudo acumulado: quien es cliente también respondió y también fue contactado.
const PELDANOS=[
  {nom:'En cartera',  tono:'var(--p1)', en:()=>true},
  {nom:'Contactados', tono:'var(--p2)', en:x=>['enviado','respondido','reunion','cliente'].includes(x.estado)},
  {nom:'Respondieron',tono:'var(--p3)', en:x=>['respondido','reunion','cliente'].includes(x.estado)},
  {nom:'Reunión',     tono:'var(--p4)', en:x=>['reunion','cliente'].includes(x.estado)},
  {nom:'Clientes',    tono:'var(--p5)', en:x=>x.estado==='cliente'},
];

function cifras(){
  const mail=municipios.filter(m=>m.contacto==='email').length;
  const nada=municipios.filter(m=>m.contacto==='falta').length;
  el('cifras').innerHTML=[
    ['Municipios',municipios.length,null],
    ['Contactados',municipios.filter(contactado).length,'var(--acento)'],
    ['Respondieron',cnt('respondido')+cnt('reunion')+cnt('cliente'),'var(--p2)'],
    ['Clientes',cnt('cliente'),'var(--bien)'],
    ['Con correo',mail,'var(--bien)'],
    ['Sin contacto',nada,'var(--serio)'],
  ].map(([t,v,c])=>`<div class="cifra"><b>${v}</b>
    <span>${c?`<i class="pt" style="background:${c}"></i>`:''}${t}</span></div>`).join('');
}

function embudo(){
  const tot=municipios.length||1; let ant=null;
  el('embudo').innerHTML=PELDANOS.map(p=>{
    const n=municipios.filter(m=>p.en(f(m.slug))).length;
    const cv=ant===null?'':ant?`${Math.round(n/ant*100)}%`:'—'; ant=n;
    return `<div class="etapa"><span class="nom">${p.nom}</span>
      <div class="via"><div class="barra" data-a="${(n/tot*100).toFixed(1)}"
        style="background:${p.tono}" title="${p.nom}: ${n} de ${tot}"></div></div>
      <span class="n">${n}${cv?`<span class="cv">${cv}</span>`:''}</span></div>`;
  }).join('');
  animar('#embudo .barra');
}

function tandas(){
  const dias=[...new Set(municipios.map(m=>m.dia))].sort((a,b)=>a-b);
  el('tandas').innerHTML=dias.map(d=>{
    const t=municipios.filter(m=>m.dia===d), h=t.filter(contactado).length;
    return `<div class="tanda"><span class="d">Día ${d}</span>
      <div class="mini" title="Tanda ${d}: ${h} de ${t.length}">
        <i data-a="${t.length?(h/t.length*100).toFixed(1):0}"></i></div>
      <span class="n">${h}/${t.length}</span></div>`;
  }).join('');
  animar('#tandas .mini i');
}

// Las barras crecen desde cero sólo al cargar; en cada filtro ya se pintan puestas.
function animar(sel){
  const n=document.querySelectorAll(sel), poner=()=>n.forEach(x=>x.style.width=x.dataset.a+'%');
  if(primera&&!matchMedia('(prefers-reduced-motion:reduce)').matches)
    requestAnimationFrame(()=>requestAnimationFrame(poner));
  else poner();
}

function filtrados(){
  const d=el('fDia').value,e=el('fEstado').value,c=el('fContacto').value,
        t=el('fTexto').value.trim().toLowerCase();
  return municipios.filter(m=>(!d||String(m.dia)===d)&&(!e||f(m.slug).estado===e)&&
    (!c||m.contacto===c)&&(!t||m.nombre.toLowerCase().includes(t)||(m.email||'').toLowerCase().includes(t)));
}

function tabla(){
  const l=filtrados();
  const cab=`<div class="fila cab"><div>Municipio</div><div>Tanda</div>
    <div>Contacto</div><div>Estado</div><div></div></div>`;
  el('tabla').innerHTML=l.length?cab+l.map(m=>{
    const x=f(m.slug);
    const con=m.email?`<span class="mail">${esc(m.email)}</span>`
      :m.tel?`<span class="meta">${esc(m.tel)}</span>`
      :`<span class="sin">⚠ sin contacto · ${esc(m.dominios||'su web')}</span>`;
    return `<div class="fila" data-s="${esc(m.slug)}">
      <div><div class="nombre">${esc(m.nombre)}</div><div class="meta">${esc(m.oficina)}</div></div>
      <div class="c-d meta">${m.dia}</div><div class="c-m">${con}</div>
      <div><select class="sel">${TODOS.map(e=>`<option value="${e}" ${x.estado===e?'selected':''}>${
        ETAPAS.find(y=>y.id===e)?.nom??'Descartado'}</option>`).join('')}</select></div>
      <div class="acc"><a href="${esc(m.demo)}" target="_blank" rel="noopener">Demo</a>
        ${m.email?`<button class="cp" data-e="${esc(m.email)}">Copiar</button>`:''}</div>
      <div class="nota"><input placeholder="Nota" value="${esc(x.nota)}"></div></div>`;
  }).join(''):cab+`<div class="vacio">Ningún municipio con esos filtros.</div>`;
  el('conteo').textContent=`${l.length} de ${municipios.length} municipios`;
}

function todo(){cifras();embudo();tandas();tabla();primera=false;revelar()}

function revelar(){
  const pendientes=document.querySelectorAll('.rev:not(.visto)');
  // Sin IntersectionObserver (o si algo falla) se enseña todo: es preferible
  // perder la animación a dejar la tabla invisible.
  if(!('IntersectionObserver' in window)){
    pendientes.forEach(n=>n.classList.add('visto')); return;
  }
  // Umbral 0, no 0.08: la tabla mide unos 10.000 px con 132 filas, y el 8% de
  // eso no cabe en pantalla, así que nunca llegaba a considerarse visible y se
  // quedaba en opacity:0. Con 0 basta con que asome un píxel.
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('visto');io.unobserve(e.target)}
  }),{threshold:0,rootMargin:'0px 0px -30px 0px'});
  pendientes.forEach((n,i)=>{ n.style.transitionDelay=(i*70)+'ms'; io.observe(n); });
}

el('tabla').addEventListener('change',ev=>{
  const fi=ev.target.closest('.fila'); if(!fi||!ev.target.classList.contains('sel'))return;
  const x=f(fi.dataset.s); x.estado=ev.target.value; x.fecha=new Date().toISOString().slice(0,10);
  guardar(); cifras(); embudo(); tandas();
});
el('tabla').addEventListener('input',ev=>{
  if(ev.target.tagName!=='INPUT')return;
  const fi=ev.target.closest('.fila'); if(fi){f(fi.dataset.s).nota=ev.target.value;guardar()}
});
el('tabla').addEventListener('click',async ev=>{
  const b=ev.target.closest('.cp'); if(!b)return;
  try{await navigator.clipboard.writeText(b.dataset.e);b.textContent='Copiado'}
  catch{b.textContent=b.dataset.e}
  setTimeout(()=>b.textContent='Copiar',1500);
});
['fDia','fEstado','fContacto','fTexto'].forEach(i=>el(i).addEventListener('input',tabla));
el('exportar').addEventListener('click',()=>{
  const b=new Blob([JSON.stringify(estado,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=`crm-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
});
el('importar').addEventListener('click',()=>el('fich').click());
el('fich').addEventListener('change',async ev=>{
  const fl=ev.target.files[0]; if(!fl)return;
  try{const d=JSON.parse(await fl.text());
    if(typeof d!=='object'||Array.isArray(d))throw 0;
    estado={...estado,...d}; guardar(); primera=true; todo();
  }catch{alert('Ese fichero no es una copia válida del CRM.')}
  ev.target.value='';
});

el('fEstado').insertAdjacentHTML('beforeend',
  TODOS.map(e=>`<option value="${e}">${ETAPAS.find(y=>y.id===e)?.nom??'Descartado'}</option>`).join(''));

cargar();
fetch('../datos/municipios.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
 .then(d=>{
   municipios=d.sort((a,b)=>a.dia-b.dia||a.nombre.localeCompare(b.nombre,'es'));
   const nd=new Set(municipios.map(m=>m.dia)).size;
   el('fDia').insertAdjacentHTML('beforeend',[...new Set(municipios.map(m=>m.dia))]
     .sort((a,b)=>a-b).map(x=>`<option value="${x}">Tanda ${x}</option>`).join(''));
   el('sub').textContent=`${municipios.length} municipios · ${nd} tandas`;
   el('navsub').textContent=`${municipios.length} municipios`;
   todo();
 })
 .catch(e=>{
   el('sub').textContent='No se pudieron cargar los datos';
   el('tabla').classList.add('visto');
   el('tabla').innerHTML=`<div class="vacio">No se pudo leer
     <code>datos/municipios.json</code> (${esc(e.message)}).<br><br>
     Ábrelo con <code>./abrir.sh</code>, no con doble clic.</div>`;
 });
</script>
</body>
</html>
